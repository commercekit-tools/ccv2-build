name: Manual Sandbox build smoke
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        required: true
        options: [success, failure, nonterminating, rate-limit, create-error]
      confirmation:
        type: string
        required: true
        description: Type RUN-COMMERCEKIT-SANDBOX-BUILD
permissions:
  contents: read
  packages: read
concurrency:
  group: ccv2-build-sandbox-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@commercekit-tools"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: prepare
        run: node scripts/sandbox/prepare.mjs
        env:
          SCENARIO: ${{ inputs.scenario }}
          CONFIRMATION: ${{ inputs.confirmation }}
      - id: build
        uses: ./
        continue-on-error: true
        with:
          token-endpoint: ${{ steps.prepare.outputs.token-endpoint }}
          client-id: ${{ steps.prepare.outputs.client-id }}
          client-secret: ${{ steps.prepare.outputs.client-secret }}
          resource: ${{ steps.prepare.outputs.resource }}
          subscription-code: ${{ steps.prepare.outputs.subscription-code }}
          branch: main
          build-name: sandbox-action-smoke-${{ github.run_id }}
          application-code: commerce
          api-base-url: https://ccv2.sandbox.commercekit.tools
          poll-interval-seconds: "10"
          timeout-minutes: "1"
      - name: Assert outputs and isolated run state
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.prepare.outcome == 'success' }}
        run: node scripts/sandbox/assert.mjs
        env:
          SCENARIO: ${{ inputs.scenario }}
          RUN_ID: ${{ steps.prepare.outputs.run-id }}
          CONTROL_TOKEN: ${{ steps.prepare.outputs.control-token }}
          CLIENT_ID: ${{ steps.prepare.outputs.client-id }}
          CLIENT_SECRET: ${{ steps.prepare.outputs.client-secret }}
          RESOURCE: ${{ steps.prepare.outputs.resource }}
          TOKEN_ENDPOINT: ${{ steps.prepare.outputs.token-endpoint }}
          RESULT_JSON: ${{ steps.build.outputs.result-json }}
          NOTIFICATION_EVENT: ${{ steps.build.outputs.notification-event }}
          BUILD_CODE: ${{ steps.build.outputs.build-code }}
          BUILD_STATUS: ${{ steps.build.outputs.build-status }}
          POLL_COUNT: ${{ steps.build.outputs.poll-count }}
          DURATION_MS: ${{ steps.build.outputs.duration-ms }}
          ACTION_OUTCOME: ${{ steps.build.outcome }}
      - name: Delete disposable run
        if: ${{ always() }}
        run: node scripts/sandbox/cleanup.mjs
        env:
          RUN_ID: ${{ steps.prepare.outputs.run-id }}
          CONTROL_TOKEN: ${{ steps.prepare.outputs.control-token }}
